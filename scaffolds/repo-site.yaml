preset: repo-site
files:
  # ---------------------------------------------------------------- index ----
  - path: site/index.html
    contents: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="description" content="{{description}}">
          <title>{{name}}</title>
          <link rel="stylesheet" href="style.css">
        </head>
        <body>
          <a class="skip-link" href="#main">Skip to content</a>
          <nav class="nav" aria-label="Primary">
            <a href="index.html" class="brand" aria-current="page">{{name}}</a>
            <a href="#signature">Signature</a>
            <a href="#commands">Commands</a>
          </nav>

          <main id="main">
            <header class="hero">
              <div class="hero-grid">
                <div>
                  <span class="eyebrow reveal">REPLACE THIS EYEBROW</span>
                  <h1 class="reveal">{{name}}</h1>
                  <p class="tagline reveal">{{description}}</p>
                  <div class="actions reveal">
                    <a class="button button-primary" href="#commands">See the commands</a>
                    <a class="button" href="https://github.com/89jobrien/{{name}}">Source</a>
                  </div>
                </div>
                <div class="terminal reveal" aria-label="Example {{name}} session">
                  <div class="terminal-bar"><span class="label">{{name}} / quickstart</span></div>
                  <pre><span class="prompt">$</span> {{name}} --help
      <span class="cmt">REPLACE: paste the real --help output here.
      The first command a reader will copy belongs on screen.</span></pre>
                </div>
              </div>
            </header>

            <section id="signature" class="reveal">
              <h2>Signature</h2>
              <p>
                Replace this paragraph with the reason this project deserves its own
                shape. A signature drawn from something the tool already does beats a
                decorative one: crux has a trace, doob a handoff board, minibox a
                container lifecycle, sparkfile the tree it emits.
              </p>
              <div class="sig">
                <div class="sig-row">
                  <span class="sig-name">REPLACE</span>
                  <span class="sig-note">what this row means</span>
                </div>
                <div class="sig-row">
                  <span class="sig-name">REPLACE</span>
                  <span class="sig-note">what this row means</span>
                </div>
              </div>
              <p class="note">
                Delete rows you cannot justify from the project's own behaviour.
              </p>
            </section>

            <section id="commands" class="reveal">
              <h2>Commands</h2>
              <p>Every command, with its real effect.</p>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr><th>Command</th><th>Effect</th></tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td><code>{{name}} REPLACE</code></td>
                      <td>REPLACE: the actual effect.</td>
                    </tr>
                    <tr>
                      <td><code>{{name}} REPLACE</code></td>
                      <td>REPLACE: the actual effect.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>

            <footer class="site-foot reveal">
              <p><a href="https://github.com/89jobrien/{{name}}">Source on GitHub</a></p>
            </footer>
          </main>
        </body>
      </html>

  # --------------------------------------------------------------- tokens ----
  # Every token shared.css references, plus --color-ink-2 for the signature.
  # Replace the palette and type below; keep the names, the shared layer needs
  # them. Do not add the SHARED-LAYER sentinels here — assemble-css.sh composes
  # this file with the shared layer and fails if they collide.
  - path: site/tokens.css
    contents: |
      /* ============================================================
         {{name}} — design tokens

         REPLACE: say why this palette fits this project and its audience.
         The pilots each justify theirs: minibox wears Gruvbox because its
         own terminal output does, sparkfile wears a drafting grid because
         it emits files. A palette picked because it looked tidy is the
         thing to avoid.

         Two inks beyond the accent carry meaning here; name what each one
         means before using it.
         ============================================================ */

      /* Default faces are wired up and working, so the generated site validates
         the moment it is composed. fetch-fonts.sh must be run with the same
         families:

           bash fetch-fonts.sh <repo> "ibm-plex-sans:var" "ibm-plex-mono:400" "ibm-plex-mono:700"

         Swap the families and the blocks together -- a @font-face pointing at a
         file that was never fetched fails validation, not just the browser. */
      @font-face {
        font-family: "IBM Plex Sans";
        font-style: normal;
        font-weight: 100 700;
        font-display: swap;
        src: url("fonts/ibm-plex-sans-latin-wght-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("fonts/ibm-plex-mono-latin-700-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }

      :root {
        color-scheme: dark;

        /* type ---------------------------------------------------------------- */
        --font-display: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
        --font-body: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;

        --font-display-weight: 600;
        --font-body-weight: 400;
        --font-body-strong: 600;
        --display-tracking: -0.02em;
        --display-tracking-body: -0.012em;
        --brand-tracking: -0.02em;

        --font-size-xs: 0.72rem;
        --font-size-sm: 0.84rem;
        --font-size-md: 1.18rem;
        --font-size-lg: clamp(1.42rem, 2.6vw, 1.9rem);
        --font-size-2xl: clamp(2.1rem, 4.6vw, 3.3rem);
        --font-size-display: clamp(2.8rem, 9vw, 6rem);

        /* palette ------------------------------------------------------------- */
        --color-bg: #12151a;
        --color-surface: #191d24;
        --color-surface-raised: #21262f;
        --color-surface-sunken: #0d1015;
        --color-fg: #e8ecf2;
        --color-fg-muted: #97a1b0;
        --color-accent: #7aa2f7;
        --color-accent-hover: #9db9ff;
        --color-accent-fg: #0b0e13;
        --color-border: #2b323d;
        --color-border-strong: #3d4653;
        --color-focus: #f0b429;

        /* second ink: state this project's signature uses ------------------------ */
        --color-ink-2: #f0b429;

        --color-nav-bg: rgb(18 21 26 / 0.9);
        --color-row-hover: rgb(122 162 247 / 0.05);
        --color-note-bg: rgb(122 162 247 / 0.07);
        --color-pill-neutral-bg: rgb(151 161 176 / 0.15);
        --color-code-bg: #0d1015;
        --color-code-fg: #d7dce3;
        --color-terminal-bg: #0d1015;
        --color-terminal-fg: #d7dce3;
        --color-dot-1: #f7768e;
        --color-dot-2: #e0af68;
        --color-dot-3: #7aa2f7;

        --color-signal-ok: #7aa2f7;
        --color-signal-ok-bg: rgb(122 162 247 / 0.14);
        --color-signal-warn: #e0af68;
        --color-signal-warn-bg: rgb(224 175 104 / 0.15);
        --color-signal-err: #f7768e;
        --color-signal-err-bg: rgb(247 118 142 / 0.14);

        /* form ---------------------------------------------------------------- */
        --radius-xs: 3px;
        --radius: 8px;
        --radius-lg: 14px;
        --radius-pill: 3px;
        --content-width: 1080px;
        --content-width-narrow: 900px;
        --stat-columns: 4;
        --terminal-min-height: 18rem;

        --shadow-card: 0 10px 30px rgb(0 0 0 / 0.34);
        --shadow-terminal: 0 24px 70px rgb(0 0 0 / 0.3);
        --shadow-nav: 0 8px 28px rgb(0 0 0 / 0.36);
        --shadow-button: 0 8px 20px -8px rgb(122 162 247 / 0.5);

        /* atmosphere: state what these washes are doing ------------------------- */
        --atmosphere-image: radial-gradient(circle at 10% -8%, rgb(122 162 247 / 0.09), transparent 30rem);
        --atmosphere-size: auto;
        --grain-image: radial-gradient(rgb(232 236 242 / 0.03) 0.5px, transparent 0.5px);
        --grain-opacity: 1;
        --grain-blend: normal;
      }

  # ------------------------------------------------------------ signature ----
  - path: site/signature.css
    contents: |
      /* ============================================================
         {{name}} — signature

         The shape this site is organised around. Draw it from something the
         project already does — a state machine, a request path, a file it
         emits — rather than from a designer's mood board. If you cannot
         name the thing being drawn, delete this file and use the shared
         layer alone.
         ============================================================ */

      .sig {
        margin: 1.5rem 0;
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        background: var(--color-surface-sunken);
        overflow: hidden;
      }

      .sig-row {
        display: grid;
        grid-template-columns: minmax(9rem, 15rem) minmax(0, 1fr);
        gap: 0.9rem 1.2rem;
        align-items: baseline;
        padding: 0.72rem 1rem;
        border-top: 1px solid var(--color-border);
      }

      .sig-row:first-child {
        border-top: 0;
      }

      .sig-row:hover {
        background: var(--color-row-hover);
      }

      .sig-name {
        font-family: var(--font-mono);
        font-size: var(--font-size-sm);
        color: var(--color-ink-2);
      }

      .sig-note {
        font-size: var(--font-size-sm);
        color: var(--color-fg-muted);
      }

      @media (max-width: 44rem) {
        .sig-row {
          grid-template-columns: minmax(0, 1fr);
          gap: 0.2rem;
        }
      }

  # --------------------------------------------------------------- pages ----
  - path: site/.nojekyll
    contents: ""

  - path: .github/workflows/pages.yml
    contents: |
      name: Deploy pages

      on:
        push:
          branches: [main]
        workflow_dispatch:

      permissions:
        contents: read
        pages: write
        id-token: write

      concurrency:
        group: pages
        cancel-in-progress: true

      jobs:
        deploy:
          environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                path: site
            - id: deployment
              uses: actions/deploy-pages@v4
